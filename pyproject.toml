[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "l3io-wordpress-database"
dynamic = ["version"]
description = "Create and inspect WordPress MySQL databases and their users, idempotently."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Anderson" }]
keywords = ["wordpress", "mysql", "mariadb", "database", "provisioning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Typing :: Typed",
]

# Core stays deliberately small. opentelemetry-api is a hard dependency on purpose:
# it is ~58KB with one dependency and already ships the no-op NonRecordingSpan /
# ProxyTracer, so putting it behind an extra would oblige us to hand-roll a shim.
dependencies = [
  "PyMySQL[rsa]>=1.2.0",
  "structlog>=26.1.0",
  "opentelemetry-api>=1.30",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
wpconfig = ["l3io-wordpress-config>=0.0.2"]
encryption = ["pyrage>=1.4,<2"]

# Development and CI arrangement only, and a deliberate choice over the Gitea
# index that l3io-wordpress-config was briefly published to. That index requires
# credentials -- /simple/l3io-wordpress-config/ returns 401 unauthenticated -- so
# consuming it would mean every developer and every CI runner needs secrets
# configured before a clean clone can resolve. This repository is public, so a
# runner clones it with no token at all.
#
# It costs nothing in published shape: `uv build --no-sources` already emits a
# plain `Requires-Dist: l3io-wordpress-config>=0.0.2`, verified on the artifact, so
# the release is correctly shaped either way and only this block changes when
# the package reaches PyPI.
#
# Not `branch = "main"`: a branch re-resolves on every `uv lock -U`, which
# exposed this package to upstream pushes.
#
# This was an annotated tag on the reasoning that a tag is "immutable in
# practice". That turned out to be wrong in the only way that mattered -- the tag
# was deleted during the family's version restart -- so the claim is retracted
# rather than left standing. A tag is immutable in CONTENT, not in EXISTENCE.
#
# This MUST NOT reach a published release: a VCS dependency in published
# metadata is exactly the defect that left wpbackup2 unresolvable for six
# years. `uv build --no-sources` strips it, leaving a plain
# `Requires-Dist: l3io-wordpress-config>=0.0.2`. Replace this block with a plain index
# dependency once l3io-wordpress-config is published.
# Mechanical enforcement of the family's uv version, matching l3io-wordpress-config.
# A lock generated by a different uv version can make `uv sync --locked` fail in
# CI while passing locally; pinning here makes that impossible rather than
# remembered. Bump deliberately and across all three repositories together.
[tool.uv]
required-version = "==0.11.6"

[tool.uv.sources]
# Back on a TAG, because there is now a released one. This was pinned by rev while
# py-wpconfigr had no usable tag -- its v1.5.0 had been deleted during the version
# restart, and a deleted tag breaks every fresh resolution while `uv sync --locked`
# keeps passing from the lock, so CI stayed green on a dependency nobody could
# resolve from scratch. v0.0.2 is a real release: tag, GitHub release, and a wheel
# in the internal registry.
#
# The NAME changed with it. The sibling is `l3io-wordpress-config` now, and the old
# rev predates that rename -- so keeping the rev would have pinned a commit whose
# metadata still declared `l3io-wordpress-config`, which is not the name declared below.
l3io-wordpress-config = { git = "https://github.com/ravensorb/l3io-wordpress-config.git", tag = "v0.0.2" }

[project.scripts]
l3io-wordpress-database = "l3io.wp.database.cli:main"

[project.urls]
Homepage = "https://github.com/ravensorb/l3io-wordpress-database"
Source = "https://github.com/ravensorb/l3io-wordpress-database"

[dependency-groups]
dev = [
  "ruff==0.16.7",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "types-pymysql>=1.2.0.20260807",
  # The contract tests read the workflow files. A maintained parser, because the
  # one thing this repo's rules will not tolerate is a hand-written YAML parser.
  "pyyaml==6.0.3",
  "types-pyyaml==6.0.12.20260906",
  # tests/test_declared_facts.py compares requirement names, specifiers and
  # versions. Declared directly rather than relied on through pytest's own
  # dependency on it.
  "packaging==26.3",
  # Span assertions need a real SDK; the package itself depends on the API only.
  "opentelemetry-sdk==1.44.0",
  # The encryption extra, also here because `uv run` prunes extras.
  "pyrage==1.4.0",
  # The optional extras are dev dependencies too, so a bare `uv run` can
  # exercise the code paths behind them. `uv run` syncs the default groups
  # only, which PRUNES extras -- without this, every `uv run` silently
  # uninstalled the wpconfig extra and its tests began skipping.
  #
  # This does not weaken the optionality guarantee. That is enforced against
  # the BUILT WHEEL in an isolated environment, by the verify-install job and
  # `make verify-wheel`, not by whatever happens to be in the dev environment.
  "boto3>=1.34",
  "l3io-wordpress-config>=0.0.2",
]

# AD-27: l3io.wp is a PEP 420 native namespace. Ship no __init__.py at
# src/l3io/ or src/l3io/wp/ -- doing so shadows the namespace and makes the
# sibling distributions unimportable, while this package's own tests still pass.
[tool.hatch.version]
# AD-30: the git tag IS the version. There is no literal anywhere in this repo
# to drift from it -- not in pyproject, not in the package -- so "keep the tag
# and the package in sync" is not a rule anyone can break.
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI rejects local version labels, so a dev build must not carry +g<sha>.
local_scheme = "no-local-version"
# Only three-component tags count. Without this the abandoned 2018 `v1.0` tag
# is the nearest ancestor of every commit on main, and setuptools-scm reads its
# two components and guesses the next MINOR: builds came out as 1.1.dev39, which
# sorts ABOVE 1.0.0 in PEP 440, so publishing one would have permanently
# outranked the release.
#
# The match also needs a three-component ancestor to find, which is what the
# v0.0.0 BASELINE tag provides. Without it the fallback was 0.1.devN, and
# 0.1.dev1 > 0.0.1 in PEP 440 -- verified, not assumed -- so a dev build published
# before the first release would have outranked it permanently. From the baseline
# an untagged tree derives 0.0.1.devN, which sorts below 0.0.1.
#
# v0.0.0 is not a release and is excluded from publish.yml's tag trigger. It also
# bounds release notes to the rewrite: 12 commits from the baseline, against 46
# from the 2018 v1.0 tag, 35 of which predate the rewrite entirely.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[tool.hatch.build.targets.wheel]
packages = ["src/l3io"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Installed tooling and generated artifacts, not this project's source. CI lints
# `.` rather than a hand-listed set of directories so a new package directory is
# covered automatically -- which means the exclusions, not the inclusions, are
# what has to be maintained.
extend-exclude = ["_bmad", "_bmad-output", ".claude", ".agents", ".github"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PTH", "BLE", "TRY", "EM", "S"]
# BLE001 (blind except) is the mechanical enforcement of the rule this rewrite
# exists for: a bare `except Exception` in the original silently converted three
# separate defects into a benign-looking False.
ignore = []

[tool.ruff.lint.per-file-ignores]
# S101 asserts are the point of a test; S105-S107 flag the fake
# credentials every credential test must construct.
"tests/*" = ["S101", "S105", "S106", "S107", "ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
# AD-27: l3io/ and l3io/wp/ have no __init__.py by design, so mypy needs to be
# told where package roots begin. The fix for "source file found twice" here is
# this setting -- never adding an __init__.py, which would break the siblings.
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# boto3 lives behind the `aws` extra and is absent from a base install, which
# is the point of AD-8.
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: builds a wheel or talks to a real database server", "transfer: export/import tests run by make test-transfer inside a server image"]
