# l3io-wordpress-database publishing.
#
# Deliberately a separate file from ci.yml, not a guarded job inside it. act has
# no OIDC and ignores `job.permissions` entirely, so an `if:` guard would not
# protect this from running locally -- file separation is the only reliable
# boundary, and .actrc/Makefile pin act to ci.yml.
#
# The default dispatch target is `mirror`, the internal Gitea registry, because
# Gitea packages can be deleted whereas PyPI and TestPyPI burn a filename
# permanently: a mistake there costs the version number forever. So the first
# ever run of this workflow can happen somewhere reversible.
#
# PyPI is reachable only by explicit dispatch, never by pushing a tag.

name: Publish

on:
  push:
    # v0.0.0 is a BASELINE, not a release: it exists so setuptools-scm has a
    # three-component ancestor (bounding release notes, and making an untagged
    # build derive 0.0.1.devN rather than 0.1.devN, which would sort ABOVE 0.0.1).
    # Excluded explicitly because pushing it DID trigger this workflow, and it was
    # stopped only by the version-gate that existed at the commit it points at --
    # a tag runs the workflows AS OF ITS OWN COMMIT, not as of main. That is luck,
    # not a guard, so here is the guard.
    # Three components only, so a floating v<major> or v<major>.<minor> tag never starts a publish.
    tags: ['v*.*.*', '!v0.0.0']
  # A published GitHub Release also mirrors, so "cut a release" is enough and
  # nobody has to remember a second step.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [mirror, testpypi, pypi]
        default: mirror

permissions: {}

jobs:
  preflight:
    # Decides whether the Gitea mirror is configured, and publishes that as an
    # OUTPUT rather than letting the mirror job test it directly.
    #
    # This indirection is required, not stylistic. The `secrets` context is NOT
    # available in a job-level (or step-level) `if:` -- only github, needs, vars
    # and inputs are. So `if: secrets.FOO != ''` does not error; it evaluates
    # empty and SILENTLY SKIPS the job. A publish that quietly does not happen is
    # the worst available outcome, so the secret is read here in a step `env`,
    # where the context IS available, and reduced to a boolean.
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      mirror_enabled: ${{ steps.check.outputs.mirror_enabled }}
    steps:
      - name: is the Gitea mirror configured?
        id: check
        env:
          MIRROR_URL: ${{ vars.PYPI_CUSTOM_URL }}
          MIRROR_USER: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          MIRROR_TOKEN: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${MIRROR_URL}" ] && [ -n "${MIRROR_USER}" ] && [ -n "${MIRROR_TOKEN}" ]; then
            echo "mirror_enabled=true" >> "$GITHUB_OUTPUT"
            echo "mirror configured at ${MIRROR_URL}"
          else
            echo "mirror_enabled=false" >> "$GITHUB_OUTPUT"
            # `${VAR:+set}` reports presence without ever echoing a value.
            echo "mirror not configured, skipping it:" \
                 "url:${MIRROR_URL:+set} user:${MIRROR_USER:+set} token:${MIRROR_TOKEN:+set}"
          fi

  version-gate:
    # A tag must agree with the version the package will actually publish.
    # Disagreement means the artifact and the git history describe different
    # releases, which is unrecoverable once a filename is burned.
    name: version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: validate the tag format
        if: startsWith(github.ref, 'refs/tags/v')
        id: tag
        uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        with:
          tag: ${{ github.ref_name }}
          version-type: semver

      - name: the tag is valid semver
        # Only the FORMAT is checked here. pyproject no longer carries a version
        # literal to compare against -- the version is dynamic, resolved by
        # hatchling from the one literal in _version.py -- so grepping it here
        # would compare against nothing. The tag/version agreement is asserted in
        # `smoke`, against the built wheel, which is the value that gets published.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          if [ "${{ steps.tag.outputs.is-valid }}" != "true" ]; then
            echo "::error::${{ github.ref_name }} is not a valid semver tag"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is valid semver"

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [version-gate]
    env:
      UV_PROJECT_ENVIRONMENT: /tmp/l3io-venv-publish-build
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      # --no-sources is load-bearing: l3io-wordpress-config is consumed from a git rev
      # during development, and a VCS dependency in published metadata makes the
      # package unresolvable from PyPI.
      - run: uv build --no-sources
      - name: no development source reached the dependency metadata
        run: uv run python tools/check_dist_metadata.py
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    # The artifact that will be published must install clean and import, in an
    # environment that has never seen this source tree.
    name: smoke · py${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
      - name: install, import, and agree on one version
        # The Python Packaging User Guide's recommended check for a project that
        # single-sources its version: assert that the import package's
        # __version__ and the DISTRIBUTION metadata report the same string.
        # https://packaging.python.org/en/latest/discussions/single-source-version/
        #
        # Run against the installed wheel rather than the source tree, because
        # the two values are produced by different mechanisms -- the attribute is
        # a literal in _version.py, the metadata is what hatchling resolved at
        # build time -- and only the built artifact exercises both.
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact in the directory silently
          # expands to two paths and the command downstream gets a nonsense
          # argument. A real runner starts empty; act binds the working tree,
          # which is how this was found.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" \
                 python - <<'PY'
          from importlib.metadata import version
          from l3io.wp import database
          attr = database.__version__
          dist = version("l3io-wordpress-database")
          if attr != dist:
              raise SystemExit(
                  f"version drift: l3io.wp.database.__version__ is {attr!r} "
                  f"but the l3io-wordpress-database distribution reports {dist!r}"
              )
          print(f"import ok, one version: {attr}")
          PY

      - name: a tagged publish must not ship a dev version
        # A dev build derives <next patch>.devN, and with the first release at
        # 0.0.1 the untagged fallback 0.1.devN sorts ABOVE it in PEP 440 -- so a
        # dev artifact reaching a registry as a release would outrank the release
        # permanently. Verified with packaging.version rather than assumed.
        #
        # Conditioned on a tag, because a dev build reaching the internal mirror is
        # deliberate: `make release dev` exists to do exactly that, with no tag and
        # no GitHub release.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          built=$(uv run --isolated --no-project --python "${{ matrix.python }}" \
                    --with "$wheel" \
                    python -c "from importlib.metadata import version; print(version('l3io-wordpress-database'))")
          python3 - "$built" <<'PY'
          import sys
          from packaging.version import Version
          built = Version(sys.argv[1])
          if built.is_devrelease or built.is_prerelease:
              raise SystemExit(f"built version {built} is a dev/pre-release; a tag must ship a final version")
          print(f"built version {built} is a final release")
          PY

      - name: a tag must agree with the artifact it publishes
        # The authoritative tag check, moved here from version-gate because this
        # is where the artifact exists. Compares the tag against the wheel's own
        # metadata, so it covers the tag, pyproject's dynamic resolution and the
        # _version.py literal in a single assertion -- and cannot pass by reading
        # a value the build did not actually use.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact in the directory silently
          # expands to two paths and the command downstream gets a nonsense
          # argument. A real runner starts empty; act binds the working tree,
          # which is how this was found.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          built=$(uv run --isolated --no-project --python "${{ matrix.python }}" \
                    --with "$wheel" \
                    python -c "from importlib.metadata import version; print(version('l3io-wordpress-database'))")
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tagged" ]; then
            echo "::error::tag $tagged does not match the built version $built"
            exit 1
          fi
          echo "tag and artifact agree on $built"
      - name: the console script runs
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact in the directory silently
          # expands to two paths and the command downstream gets a nonsense
          # argument. A real runner starts empty; act binds the working tree,
          # which is how this was found.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" l3io-wordpress-database --version
      - name: base install pulls no optional dependency
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact in the directory silently
          # expands to two paths and the command downstream gets a nonsense
          # argument. A real runner starts empty; act binds the working tree,
          # which is how this was found.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          uv run --isolated --no-project --python "${{ matrix.python }}" \
                 --with "$wheel" \
                 python - <<'PY'
          import importlib.util, sys
          for forbidden in ("boto3", "botocore", "l3io.wp.config"):
              if importlib.util.find_spec(forbidden) is not None:
                  sys.exit(f"base install pulled {forbidden}")
          print("base install is clean")
          PY

      - name: AD-27 the published artifact does not shadow the namespace
        # Re-checked here, not only in ci.yml, because this is the last point
        # before the bytes leave: ci.yml guards the source tree, and a build or
        # packaging change could introduce a marker file that the source check
        # never sees. Asserted against the WHEEL, which is the thing published.
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact in the directory silently
          # expands to two paths and the command downstream gets a nonsense
          # argument. A real runner starts empty; act binds the working tree,
          # which is how this was found.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          python3 - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          # Scope assertion first, so this cannot pass over an empty set the way
          # a bare "no forbidden entries" test would on an empty or wrong wheel.
          area = "l3io/wp/database/__init__.py"
          if area not in names:
              sys.exit(f"AD-27 -- {area} absent; wrong or empty wheel, guard would be vacuous")
          for forbidden in ("l3io/__init__.py", "l3io/wp/__init__.py"):
              if forbidden in names:
                  sys.exit(f"AD-27 -- {forbidden} in the wheel shadows the shared namespace "
                           "and makes the sibling distributions unimportable")
          print("namespace clean in the wheel: no marker file above the area package")
          PY

  publish-mirror:
    # The internal Gitea registry. Token auth, because a Gitea registry does not
    # support trusted publishing. Skipped entirely when the variable is unset,
    # so a fork or a clean clone is unaffected.
    name: mirror to internal registry
    runs-on: ubuntu-latest
    needs: [smoke, preflight]
    # Auto-publishes whenever the mirror is configured AND this is a release
    # event -- a v* tag, a published GitHub Release, or an explicit mirror
    # dispatch. Still gated on the TARGET as well: without the event condition
    # this would run on every trigger, so a TestPyPI dry run would also push
    # here, publishing somewhere the operator did not choose.
    if: >-
      needs.preflight.outputs.mirror_enabled == 'true' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'mirror'))
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.6"
      - name: is this version already on the registry?
        # Makes a re-run idempotent. `uv publish --check-url` does NOT do this:
        # its check URL is the authenticated simple index and the check does not
        # receive the publish credentials, so it falls through to uploading and
        # 409s anyway. Verified by a sibling package's first tag run.
        #
        # Name and version come from the WHEEL FILENAME, not pyproject.toml --
        # this job downloads an artifact and never checks out the repo, so
        # reading pyproject would be a FileNotFoundError. The wheel is also the
        # better source: the question is whether THOSE artifacts are present,
        # not what the repo currently declares.
        id: exists
        env:
          MIRROR_URL: ${{ vars.PYPI_CUSTOM_URL }}
          MIRROR_USER: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          MIRROR_TOKEN: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: |
          set -euo pipefail
          # Exactly one wheel, asserted rather than assumed. `ls dist/*.whl`
          # returns every match, so a stale artifact in the directory silently
          # expands to two paths and the command downstream gets a nonsense
          # argument. A real runner starts empty; act binds the working tree,
          # which is how this was found.
          count=$(find dist -maxdepth 1 -name '*.whl' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found $count"
            find dist -maxdepth 1 -name '*.whl'
            exit 1
          fi
          wheel=$(find dist -maxdepth 1 -name '*.whl')
          base=$(basename "$wheel")
          # PEP 503 normalisation: the wheel says l3io_wordpress_database, the index
          # wants l3io-wordpress-database.
          name=$(printf '%s' "${base%%-*}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-_.]+/-/g')
          echo "looking for $base under $name"
          code=$(curl -sS -o /tmp/simple.html -w '%{http_code}' \
                   -u "${MIRROR_USER}:${MIRROR_TOKEN}" \
                   "${MIRROR_URL%/}/simple/${name}/" || echo "000")
          # Skip ONLY on an explicit 200 that already lists this exact file. A
          # 404, a 000 transport error, or a 200 without the file all publish and
          # let the registry be the authority rather than skipping on ambiguity.
          if [ "$code" = "200" ] && grep -qF "$base" /tmp/simple.html; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$base is already on the registry; skipping upload"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "not present (index HTTP $code); will publish"
          fi

      - name: upload to Gitea
        if: steps.exists.outputs.already_published != 'true'
        env:
          UV_PUBLISH_URL: ${{ vars.PYPI_CUSTOM_URL }}
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_CUSTOM_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_CUSTOM_PASSWORD }}
        run: uv publish dist/*

  release:
    # Creates the GitHub Release for a tag, with the artifacts attached.
    #
    # Deliberately does NOT depend on publish-mirror. A sibling package's first
    # tag run went red on the mirror with a 409 and the release survived only
    # because of that independence -- a registry problem must not cost a release.
    #
    # Gated on `event_name == 'push'` rather than `!= 'release'`: when the
    # trigger IS a published release the release already exists, and the positive
    # spelling says what it means instead of enumerating what it is not.
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [smoke]
    # Runs on a tag ref for a push OR a dispatch. It used to require `push`, on the
    # reasoning that a `release: published` event already has its release -- true,
    # and still excluded below. What that missed: GitHub does NOT trigger workflows
    # from a ref created with GITHUB_TOKEN, so the tag release.yml creates fires no
    # push event at all and this job was simply never reached. Verified: v0.0.1 was
    # pushed by the action and produced ZERO Publish runs.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }  # hatch-vcs needs tags; shallow yields 0.1.devN
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }

      # The previous RELEASE tag: three components only, so a floating tag on
      # the same commit can never be taken for it. Empty on the first release.
      - name: the previous release tag
        id: previous
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"
          echo "previous release tag: ${prev:-none}"

      - name: build the release notes from the commit log
        # Notes come from commit messages, not a hand-maintained file: one source
        # rather than two that drift. COMMIT mode because this repo's history is
        # direct commits to main -- PR mode, the action's default, would return
        # nothing here.
        #
        # `configuration` is a path READ FROM THE WORKING TREE, which is why the
        # job checks out above. A release job that only downloads the artifact has
        # no working tree, so the config would be silently absent and the builder
        # would fall back to its defaults with no error.
        id: notes
        uses: LiquidLogicLabs/git-action-release-changelog-builder@v3
        with:
          platform: github
          token: ${{ secrets.GITHUB_TOKEN }}
          mode: COMMIT
          # Explicit, never auto-detected: auto-detection takes the nearest tag,
          # which a floating tag on this commit would be.
          from-tag: ${{ steps.previous.outputs.tag }}
          to-tag: ${{ github.ref_name }}
          configuration: .github/changelog-config.json
          fail-on-error: 'false'

      - name: create the release
        # The org's action rather than `gh release create`, because it speaks
        # GitHub and Gitea both -- the same step can publish the release to the
        # self-hosted instance later without a second implementation.
        uses: LiquidLogicLabs/git-action-release@v2
        with:
          platform: github
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: dist/*
          body: ${{ steps.notes.outputs.changelog }}
          # The fallback: if the build returns nothing -- no commits in range, or
          # the action erred with fail-on-error false -- the platform generator
          # runs instead, so a release is never published bodyless.
          generate-release-notes: ${{ steps.notes.outputs.changelog == '' }}
          # A release is cut once. Refuse to overwrite one, because the registry
          # filename behind it is already spent.
          allow-updates: 'false'
          # Re-dispatchable now, so a second run must not fail on an
          # existing release. Idempotent, not overwriting.
          skip-if-release-exists: 'true'

  publish-testpypi:
    # Requires a TestPyPI trusted publisher for this repository. Until one is
    # configured this target will fail at the publish step rather than silently
    # doing nothing -- which is the preferable failure.
    name: TestPyPI
    runs-on: ubuntu-latest
    needs: [smoke]
    # Dispatched on the release tag (`--ref v<version>`): from a branch the build is a
    # .dev version, and an index burns every filename it accepts.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
      && startsWith(github.ref, 'refs/tags/v')
    environment: testpypi
    permissions:
      id-token: write
    steps:
      # The name-claim release gate: refuse a name someone else holds, before the
      # upload burns it.
      # Needs the checkout for pyproject.toml; the runner's python3 is enough,
      # because the gate is stdlib-only.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }  # hatch-vcs needs tags; shallow yields 0.1.devN
      - name: the name is unclaimed or ours
        run: python3 tools/check_name_claim.py --index testpypi
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    # Never tag-triggered. PyPI burns a filename permanently, so reaching it
    # takes a deliberate dispatch with the target named explicitly.
    #
    # Nothing may go to PyPI until every dependency beneath it can resolve from
    # PyPI too: publishing this while l3io-wordpress-config exists only on the internal
    # registry would make `pip install l3io-wordpress-database[wpconfig]` unresolvable.
    name: PyPI
    runs-on: ubuntu-latest
    needs: [smoke]
    # Dispatched on the release tag (`--ref v<version>`): from a branch the build is a
    # .dev version, and an index burns every filename it accepts.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
      && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The name-claim release gate: refuse a name someone else holds, before the
      # upload burns it.
      # Needs the checkout for pyproject.toml; the runner's python3 is enough,
      # because the gate is stdlib-only.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }  # hatch-vcs needs tags; shallow yields 0.1.devN
      - name: the name is unclaimed or ours
        run: python3 tools/check_name_claim.py --index pypi
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
